version: '3.8'

services:
  autopilot:
    image: kodesurge/autopilot-esp8266:latest

    container_name: autopilot-dev
    privileged: true
    ports:
      - "8081:8081"
    volumes:
      - ./data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G


