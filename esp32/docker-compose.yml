version: '3.8'

services:
  autopilot:
    image: kodesurge/autopilot-esp32:latest

    container_name: autopilot-dev
    privileged: true
    ports:
      - "8081:8081"
    volumes:
      - ./data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  docling:
    image: ghcr.io/docling-project/docling-rs-serve:latest
    ports:
      - "5001:5001"


